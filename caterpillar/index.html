<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caterpillar gaits</title>
<style>
:root{--paper:#fafafa;--ink:#111;--box:#0064e6;--soft:#6b6b6b}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.4 system-ui,sans-serif;padding:24px 16px}
main{display:flex;flex-wrap:wrap;gap:32px;justify-content:center}
figure{margin:0;text-align:center}
svg{width:min(420px,90vw);height:auto;display:block}
figcaption{margin-top:8px}
.speed{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.speed button{font:inherit;padding:6px 12px;border:2px solid var(--ink);background:none;cursor:pointer}
.speed button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
</style>
</head>
<body>
<div class="speed" role="group" aria-label="Speed">
  <button type="button" data-k="1" aria-pressed="true">1×</button>
  <button type="button" data-k="4" aria-pressed="false">4×</button>
  <button type="button" data-k="0" aria-pressed="false">Pause</button>
</div>
<main>
  <figure><svg id="hump" viewBox="0 0 400 400"></svg><figcaption>Travelling hump</figcaption></figure>
  <figure><svg id="loop" viewBox="0 0 400 400"></svg><figcaption>Inchworm loop</figcaption></figure>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, a, p) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.append(e); return e; };
let K = 1;
document.querySelectorAll(".speed button").forEach((b) => b.addEventListener("click", () => {
  K = +b.dataset.k;
  document.querySelectorAll(".speed button").forEach((x) => x.setAttribute("aria-pressed", x === b));
}));

const R = 10;          // segment radius
const N = 8;           // segments, tail = 0, head = N - 1
const D = R * 1.9;     // rest spacing between centres along the surface

// The square grown by R with quarter-circle corners keeps a rolling circle tangent to it.
// s is arc length clockwise from the top-left end of the top edge; P(s) returns the point
// and the outward normal.
function track(x0, y0, w, h) {
  const q = Math.PI * R / 2;
  const L = 2 * w + 2 * h + 4 * q;
  function P(s) {
    s = ((s % L) + L) % L;
    if (s < w) return { x: x0 + s, y: y0 - R, nx: 0, ny: -1 };
    s -= w;
    if (s < q) { const a = -Math.PI / 2 + s / R; return { x: x0 + w + Math.cos(a) * R, y: y0 + Math.sin(a) * R, nx: Math.cos(a), ny: Math.sin(a) }; }
    s -= q;
    if (s < h) return { x: x0 + w + R, y: y0 + s, nx: 1, ny: 0 };
    s -= h;
    if (s < q) { const a = s / R; return { x: x0 + w + Math.cos(a) * R, y: y0 + h + Math.sin(a) * R, nx: Math.cos(a), ny: Math.sin(a) }; }
    s -= q;
    if (s < w) return { x: x0 + w - s, y: y0 + h + R, nx: 0, ny: 1 };
    s -= w;
    if (s < q) { const a = Math.PI / 2 + s / R; return { x: x0 + Math.cos(a) * R, y: y0 + h + Math.sin(a) * R, nx: Math.cos(a), ny: Math.sin(a) }; }
    s -= q;
    if (s < h) return { x: x0 - R, y: y0 + h - s, nx: -1, ny: 0 };
    s -= h;
    const a = Math.PI + s / R;
    return { x: x0 + Math.cos(a) * R, y: y0 + Math.sin(a) * R, nx: Math.cos(a), ny: Math.sin(a) };
  }
  return P;
}
const at = (P, s, y) => { const p = P(s); return { x: p.x + p.nx * y, y: p.y + p.ny * y }; };

function body(svg) {
  mk("rect", { x: 120, y: 120, width: 160, height: 160, fill: "var(--box)" }, svg);
  const g = mk("g", {}, svg);
  const ants = [0, 1].map(() => mk("line", { stroke: "var(--ink)", "stroke-width": 2, "stroke-linecap": "round" }, g));
  const segs = [];
  for (let i = 0; i < N; i++) segs.push(mk("circle", { r: R, fill: "var(--ink)" }, g));
  const eyes = [0, 1].map(() => ({ w: mk("circle", { r: R * 0.34, fill: "#fff" }, g), p: mk("circle", { r: R * 0.17, fill: "var(--ink)" }, g) }));
  return { svg, segs, eyes, ants };
}

function drawHead(b, pts, P, sHead) {
  const h = pts[N - 1], n = pts[N - 2];
  let fx = h.x - n.x, fy = h.y - n.y; const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
  const sp = P(sHead), ux = sp.nx, uy = sp.ny;
  b.eyes.forEach((e, k) => {
    const back = k ? 0.05 : 0.5;
    const ex = h.x + fx * R * back + ux * R * 0.3, ey = h.y + fy * R * back + uy * R * 0.3;
    e.w.setAttribute("cx", ex); e.w.setAttribute("cy", ey);
    e.p.setAttribute("cx", ex + fx * R * 0.12); e.p.setAttribute("cy", ey + fy * R * 0.12);
  });
  b.ants.forEach((a, k) => {
    const bx = h.x + ux * R * 0.8 + fx * R * (k ? -0.15 : 0.3), by = h.y + uy * R * 0.8 + fy * R * (k ? -0.15 : 0.3);
    a.setAttribute("x1", bx); a.setAttribute("y1", by);
    a.setAttribute("x2", bx + ux * R * 0.7 + fx * R * (k ? 0.2 : 0.55)); a.setAttribute("y2", by + uy * R * 0.7 + fy * R * (k ? 0.2 : 0.55));
  });
}

function place(b, pts) {
  pts.forEach((p, i) => { b.segs[i].setAttribute("cx", p.x.toFixed(2)); b.segs[i].setAttribute("cy", p.y.toFixed(2)); });
}

const ease = (u) => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);

{
  const b = body(document.getElementById("hump"));
  const P = track(120, 120, 160, 160);
  const STEP = R * 1.1, LIFT = R * 1.9;
  const LAG = 0.28, MOVE = 1.0, REST = 0.9;           // seconds
  const WAVE = LAG * (N - 1) + MOVE, T = WAVE + REST;
  const base = []; for (let i = 0; i < N; i++) base[i] = i * D;
  let t = 0, cycles = 0, last = performance.now();
  function frame(now) {
    t += Math.min(0.05, (now - last) / 1000) * K; last = now;
    while (t >= T) { t -= T; cycles++; }
    const pts = [];
    let sHead = 0;
    for (let i = 0; i < N; i++) {
      const u = (t - i * LAG) / MOVE;
      const k = ease(u);
      const s = base[i] + (cycles + k) * STEP;
      const lift = u > 0 && u < 1 ? Math.sin(Math.PI * u) * LIFT * (i === N - 1 ? 0.5 : i === 0 ? 0.6 : 1) : 0;
      pts.push(at(P, s, lift));
      if (i === N - 1) sHead = s;
    }
    place(b, pts); drawHead(b, pts, P, sHead);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// The looped body is a circular arc of fixed length BODY whose chord is the tail-to-head gap.
{
  const b = body(document.getElementById("loop"));
  const P = track(120, 120, 160, 160);
  const BODY = (N - 1) * D, MIN = BODY * 0.3;
  const GATHER = 1.4, HOLD = 0.35, REACH = 1.2, LIE = 0.6;   // seconds
  const T = GATHER + HOLD + REACH + LIE;
  const STRIDE = BODY - MIN;
  // Half-angle th of an arc with chord c and length L: sin(th)/th = c/L.
  function half(c) {
    const r = Math.min(0.9999, c / BODY);
    let lo = 1e-4, hi = Math.PI - 1e-4;
    for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2; if (Math.sin(m) / m > r) lo = m; else hi = m; }
    return (lo + hi) / 2;
  }
  let t = 0, cycles = 0, last = performance.now();
  function frame(now) {
    t += Math.min(0.05, (now - last) / 1000) * K; last = now;
    while (t >= T) { t -= T; cycles++; }
    const o = cycles * STRIDE;
    let tail, head;
    if (t < GATHER) { tail = o + ease(t / GATHER) * STRIDE; head = o + BODY; }
    else if (t < GATHER + HOLD) { tail = o + STRIDE; head = o + BODY; }
    else if (t < GATHER + HOLD + REACH) { tail = o + STRIDE; head = o + BODY + ease((t - GATHER - HOLD) / REACH) * STRIDE; }
    else { tail = o + STRIDE; head = o + BODY + STRIDE; }
    const c = head - tail;
    // Blended near flat so the loop doesn't jump when it starts at a corner.
    const flat = [];
    for (let i = 0; i < N; i++) flat.push(at(P, tail + (i / (N - 1)) * c, 0));
    const pts = flat;
    const A = P(tail), B = P(head), M = P((tail + head) / 2);
    const cx = B.x - A.x, cy = B.y - A.y, ch = Math.hypot(cx, cy);
    const w = Math.min(1, Math.max(0, (BODY - c) / (2 * D)));
    if (w > 0 && ch < BODY - 0.01) {
      const th = half(ch), rad = BODY / (2 * th);
      let nx = -cy / ch, ny = cx / ch;
      if (nx * (M.nx + A.nx + B.nx) + ny * (M.ny + A.ny + B.ny) < 0) { nx = -nx; ny = -ny; }
      const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, ux = cx / ch, uy = cy / ch;
      const oc = -rad * Math.cos(th);
      for (let i = 0; i < N; i++) {
        const ph = -th + (i / (N - 1)) * 2 * th;
        const ax = rad * Math.sin(ph), ay = oc + rad * Math.cos(ph);
        const x = mx + ux * ax + nx * ay, y = my + uy * ax + ny * ay;
        pts[i] = { x: flat[i].x + (x - flat[i].x) * w, y: flat[i].y + (y - flat[i].y) * w };
      }
    }
    place(b, pts); drawHead(b, pts, P, head);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
