<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208">
  <title>OMSNIC quote: before, you picked a state PDF, printed and filled it, and emailed an agent who quoted later; after, Quick Quote prices each answer you give as it comes, to a quote and Apply now</title>
  <defs>
    <marker id="om-head-b" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="104" r="24"/>
    <path d="M32 80V40H80" marker-end="url(#om-head-b)"/>
    <rect x="88" y="16" width="128" height="48"/>
    <path d="M216 40H248" marker-end="url(#om-head-b)"/>
    <rect x="256" y="16" width="128" height="48"/>
    <path d="M384 40H448" stroke-dasharray="4 4" marker-end="url(#om-head-b)"/>
    <circle cx="480" cy="40" r="24"/>
    <path d="M32 128V168H80" marker-end="url(#om-head-b)"/>
    <path d="M232 168H296" marker-end="url(#om-head-b)"/>
    <rect x="304" y="144" width="128" height="48"/>
    <path d="M432 168H488" marker-end="url(#om-head-b)"/>
    <rect x="496" y="144" width="128" height="48"/>
  </g>
  <rect x="88" y="144" width="144" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="104">You</text>
    <text x="152" y="40">State PDF</text>
    <text x="320" y="40">Print and fill</text>
    <text x="480" y="40">Agent</text>
    <text class="knock" x="160" y="168">Quick Quote</text>
    <text x="368" y="168">Live price</text>
    <text x="560" y="168">Quote</text>
  </g>
  <g fill="currentColor" font-size="12" dominant-baseline="central">
    <text class="mute" x="416" y="28" text-anchor="middle">email</text>
    <text class="mute" x="512" y="40">quotes later</text>
    <text class="mute" x="264" y="156" text-anchor="middle">each answer</text>
    <text class="mute" x="460" y="156" text-anchor="middle">Apply now</text>
    <text class="mute" x="40" y="28">before</text>
    <text class="mute" x="40" y="180">after</text>
  </g>
</svg>
