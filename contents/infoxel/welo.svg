      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="40" cy="152" r="24"/>
    <path d="M64 152H112" marker-end="url(#infoxel-head-b)"/>
    <circle cx="176" cy="64" r="24"/>
