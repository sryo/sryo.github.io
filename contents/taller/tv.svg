<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256">
  <title>Taller, digital TV: the TDA signal reaches a home antenna and a Ginga receiver, which runs the interactive apps written in Lua, while a companion app helps locate and orient the antenna</title>
  <defs>
    <marker id="taller-head-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" stroke-dasharray="4 4" marker-end="url(#taller-head-a)"/>
    <rect x="88" y="16" width="160" height="48"/>
    <path d="M168 64V96" marker-end="url(#taller-head-a)"/>
    <rect x="88" y="104" width="160" height="48"/>
    <path d="M168 152V184" marker-end="url(#taller-head-a)"/>
    <rect x="288" y="16" width="120" height="48"/>
    <path d="M288 40H256" marker-end="url(#taller-head-a)"/>
  </g>
  <rect x="88" y="192" width="160" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">TDA</text>
    <text x="168" y="40">Home antenna</text>
    <text x="168" y="128">Ginga receiver</text>
    <text class="knock" x="168" y="216">Interactive apps, Lua</text>
    <text x="348" y="40">Companion app</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" dominant-baseline="central">
    <text x="178" y="168">runs</text>
    <text x="348" y="80" text-anchor="middle">locate and orient</text>
  </g>
</svg>
