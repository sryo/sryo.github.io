  <rect x="280" y="80" width="144" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="48" y="64">Homeowner</text>
    <text x="172" y="104">One thread per job</text>
    <text class="knock" x="352" y="104">HometownLocal</text>
    <text x="504" y="40">Calendar</text>
    <text x="504" y="104">Route planning</text>
    <text x="504" y="168">Kanban board</text>
