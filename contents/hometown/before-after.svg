<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248">
  <title>HometownLocal before and after: the directory handed a homeowner to a provider and the job moved to other tools; the platform now holds booking, scheduling, messaging and billing between them</title>
  <defs>
    <marker id="hometown-head-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="48" cy="64" r="24"/>
    <path d="M72 64H96" marker-end="url(#hometown-head-a)"/>
    <rect x="104" y="40" width="112" height="48"/>
    <path d="M216 64H264" marker-end="url(#hometown-head-a)"/>
    <circle cx="296" cy="64" r="24"/>
    <path d="M320 64H432" stroke-dasharray="4 4" marker-end="url(#hometown-head-a)"/>
    <rect x="440" y="40" width="192" height="48"/>
    <circle cx="48" cy="192" r="24"/>
    <path d="M72 192H96" marker-end="url(#hometown-head-a)"/>
    <path d="M512 192H576" marker-end="url(#hometown-head-a)"/>
    <circle cx="608" cy="192" r="24"/>
  </g>
  <rect x="104" y="168" width="408" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="48" y="104">Homeowner</text>
    <text x="160" y="64">Directory</text>
    <text x="296" y="104">Provider</text>
    <text x="536" y="64">Calls, calendars, invoices</text>
    <text x="48" y="232">Homeowner</text>
    <text class="knock" x="308" y="192">HometownLocal: booking to billing</text>
    <text x="608" y="232">Provider</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" dominant-baseline="central">
    <text x="8" y="12">Before</text>
    <text x="8" y="140">After</text>
    <text x="240" y="48" text-anchor="middle">a lead</text>
    <text x="376" y="48" text-anchor="middle">everything else</text>
    <text x="544" y="176" text-anchor="middle">the job</text>
  </g>
</svg>
