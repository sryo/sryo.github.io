<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232">
  <title>Bancón: someone with only a phone opens a logical account with no paperwork; separately, a customer in quarantine tracks their card to a second address or pays with a virtual card before it arrives</title>
  <defs>
    <marker id="bancor-head-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <circle cx="32" cy="168" r="24"/>
    <path d="M56 40H136V100H168" marker-end="url(#bancor-head-a)"/>
    <path d="M56 168H136V124H168" marker-end="url(#bancor-head-a)"/>
    <path d="M288 100H320V40H472" marker-end="url(#bancor-head-a)"/>
    <path d="M288 124H336V136H472" marker-end="url(#bancor-head-a)"/>
    <path d="M336 136V200H472" marker-end="url(#bancor-head-a)"/>
    <rect x="480" y="16" width="144" height="48"/>
    <rect x="480" y="112" width="144" height="48"/>
    <rect x="480" y="176" width="144" height="48"/>
  </g>
  <rect x="176" y="88" width="112" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="32" y="168">You</text>
    <text class="knock" x="232" y="112">Bancón</text>
    <text x="552" y="40">Logical account</text>
    <text x="552" y="136">Card tracking</text>
    <text x="552" y="200">Virtual card</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="24">phone only</text>
    <text x="100" y="188">in quarantine</text>
    <text x="400" y="24">no paperwork</text>
    <text x="404" y="120">to a second address</text>
    <text x="404" y="184">pay before it arrives</text>
  </g>
</svg>
