<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192">
  <title>Continental research: support agents and cardholders were interviewed; the agents asked for density, which led to denser screens instead of more scrolling, and to filters that made the agents measurably faster</title>
  <defs>
    <marker id="continental-head-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="64" cy="40" r="24"/>
    <circle cx="64" cy="136" r="24"/>
    <path d="M88 40H272V56" marker-end="url(#continental-head-a)"/>
    <path d="M88 136H272V120" marker-end="url(#continental-head-a)"/>
    <rect x="216" y="64" width="112" height="48"/>
    <path d="M328 88H352V40H376" marker-end="url(#continental-head-a)"/>
    <path d="M352 88V136H376" marker-end="url(#continental-head-a)"/>
    <rect x="384" y="16" width="128" height="48"/>
    <rect x="384" y="112" width="128" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" dominant-baseline="central">
    <text x="64" y="80" text-anchor="middle">Support agents</text>
    <text x="64" y="176" text-anchor="middle">Cardholders</text>
    <g text-anchor="middle">
      <text x="272" y="88">Research</text>
      <text x="448" y="40">Denser screens</text>
      <text x="448" y="136">Filters</text>
    </g>
  </g>
  <g class="mute" fill="currentColor" font-size="12" dominant-baseline="central">
    <text x="176" y="24">asked for density</text>
    <text x="528" y="40">not more scrolling</text>
    <text x="528" y="136">agents faster</text>
  </g>
</svg>
