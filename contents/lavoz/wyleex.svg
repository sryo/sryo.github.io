<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224">
  <title>Wyleex: every reader goes through one in-house paywall that meters articles per user, gates free, premium and exclusive stories, and sells subscriptions in pesos through local payment processors</title>
  <defs>
    <marker id="lavoz-head-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="112" r="24"/>
    <path d="M56 112H152" marker-end="url(#lavoz-head-a)"/>
    <path d="M272 112H312" marker-end="url(#lavoz-head-a)"/>
    <path d="M296 112V40H312" marker-end="url(#lavoz-head-a)"/>
    <path d="M296 112V184H312" marker-end="url(#lavoz-head-a)"/>
    <rect x="320" y="16" width="192" height="48"/>
    <rect x="320" y="88" width="192" height="48"/>
    <rect x="320" y="160" width="192" height="48"/>
    <path d="M512 184H552" stroke-dasharray="4 4" marker-end="url(#lavoz-head-a)"/>
    <circle cx="584" cy="184" r="24"/>
  </g>
  <rect x="160" y="88" width="112" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="152">Reader</text>
    <text class="knock" x="216" y="112">Wyleex</text>
    <text x="416" y="40">Metering per user</text>
    <text x="416" y="112">Free, premium, exclusive</text>
    <text x="416" y="184">Subscriptions in pesos</text>
    <text x="584" y="144">Local payments</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="104" y="96">opens a story</text>
  </g>
</svg>
