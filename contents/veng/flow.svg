<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224">
  <title>VENG: a user searches the map, previews a low-resolution image, then orders it from the catalog or, when the catalog has none, requests a new SAOCOM capture</title>
  <defs>
    <marker id="veng-head-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="64" r="24"/>
    <path d="M56 64H80" marker-end="url(#veng-head-a)"/>
    <path d="M224 64H256" marker-end="url(#veng-head-a)"/>
    <rect x="256" y="40" width="160" height="48"/>
    <path d="M416 64H448" marker-end="url(#veng-head-a)"/>
    <rect x="448" y="40" width="184" height="48"/>
    <path d="M152 88V144" marker-end="url(#veng-head-a)"/>
    <rect x="80" y="144" width="144" height="48"/>
    <path d="M224 168H392" stroke-dasharray="4 4" marker-end="url(#veng-head-a)"/>
    <circle cx="416" cy="168" r="24"/>
  </g>
  <rect x="80" y="40" width="144" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="64">User</text>
    <text class="knock" x="152" y="64">Map search</text>
    <text x="336" y="64">Low-res preview</text>
    <text x="540" y="64">Catalog order</text>
    <text x="152" y="168">Tasking request</text>
    <text x="416" y="208">SAOCOM</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="152" y="24">location, date, cloud cover</text>
    <text x="540" y="24">delivered within 24h</text>
    <text x="164" y="116" text-anchor="start">not in the catalog</text>
    <text x="308" y="152">new capture</text>
  </g>
</svg>
