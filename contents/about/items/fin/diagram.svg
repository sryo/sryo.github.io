<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>Fin: you point the camera at a receipt, the form fills itself in, you confirm the category it suggests, and that category's block in the treemap grows</title>
  <defs>
    <marker id="fin-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#fin-head)"/>
    <rect x="88" y="16" width="240" height="48"/>
    <path d="M328 40H360" marker-end="url(#fin-head)"/>
    <rect x="368" y="16" width="208" height="48"/>
    <path d="M472 64V104" marker-end="url(#fin-head)"/>
    <rect x="384" y="112" width="176" height="48"/>
    <path d="M384 136H352" marker-end="url(#fin-head)"/>
    <rect x="96" y="112" width="248" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="208" y="40">Point the camera at a receipt</text>
    <text x="472" y="40">The form fills itself in</text>
    <text x="472" y="136">Confirm the category</text>
    <text x="220" y="136">Its block in the treemap grows</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="536" y="84">it suggests one</text>
  </g>
</svg>
