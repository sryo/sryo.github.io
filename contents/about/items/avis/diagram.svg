<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176">
  <title>Avis: you point at an element, write what should change and type done; the agent reads your notes, edits the code and resolves each note</title>
  <defs>
    <marker id="avis-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#avis-head)"/>
    <rect x="88" y="16" width="160" height="48"/>
    <path d="M248 40H280" marker-end="url(#avis-head)"/>
    <rect x="288" y="16" width="112" height="48"/>
    <path d="M400 40H432" marker-end="url(#avis-head)"/>
    <rect x="440" y="16" width="128" height="48"/>
    <path d="M504 64V104" marker-end="url(#avis-head)"/>
    <rect x="400" y="112" width="208" height="48"/>
    <path d="M400 136H376" marker-end="url(#avis-head)"/>
    <rect x="192" y="112" width="176" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="168" y="40">Point at an element</text>
    <text x="344" y="40">Write a note</text>
    <text x="504" y="40">Type "done"</text>
    <text x="504" y="136">The agent edits the code</text>
    <text x="280" y="136">Your note is resolved</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="408" y="84">the agent reads your notes</text>
  </g>
</svg>
