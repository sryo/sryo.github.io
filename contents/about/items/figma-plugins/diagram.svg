<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176">
  <title>Figma Plugins: you select text with link markup and run Anchorify; the markup becomes clickable links and a note tells you how many it fixed</title>
  <defs>
    <marker id="figma-plugins-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#figma-plugins-head)"/>
    <rect x="88" y="16" width="224" height="48"/>
    <path d="M312 40H344" marker-end="url(#figma-plugins-head)"/>
    <rect x="352" y="16" width="120" height="48"/>
    <path d="M412 64V104" marker-end="url(#figma-plugins-head)"/>
    <rect x="312" y="112" width="200" height="48"/>
    <path d="M312 136H288" marker-end="url(#figma-plugins-head)"/>
    <rect x="104" y="112" width="176" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="200" y="40">Select text with link markup</text>
    <text x="412" y="40">Run Anchorify</text>
    <text x="412" y="136">The markup becomes links</text>
    <text x="192" y="136">It tells you how many</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="376" y="84">in place</text>
  </g>
</svg>
