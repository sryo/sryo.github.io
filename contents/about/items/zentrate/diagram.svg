<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>ZenTrate: you glance at the home screen, tap the word Pay, the bank app opens, and Pay is a little bigger the next time you look</title>
  <defs>
    <marker id="zentrate-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#zentrate-head)"/>
    <path d="M200 40H232" marker-end="url(#zentrate-head)"/>
    <rect x="240" y="16" width="112" height="48"/>
    <path d="M352 40H400" marker-end="url(#zentrate-head)"/>
    <circle cx="432" cy="40" r="24"/>
    <path d="M296 64V104" marker-end="url(#zentrate-head)"/>
    <rect x="208" y="112" width="176" height="48"/>
    <path d="M208 136H144V72" marker-end="url(#zentrate-head)"/>
  </g>
  <rect x="88" y="16" width="112" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text class="knock" x="144" y="40">ZenTrate</text>
    <text x="296" y="40">Tap “Pay”</text>
    <text x="432" y="80">Bank app</text>
    <text x="296" y="136">“Pay” grows a little</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="376" y="28">opens</text>
    <text x="328" y="84">each tap</text>
    <text x="176" y="152">next time</text>
  </g>
</svg>
