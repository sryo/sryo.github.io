    <text x="404" y="208">zentrate_stats.json</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="72" y="96">tap</text>
    <text x="248" y="28">items</text>
    <text x="512" y="28">edit</text>
    <text x="412" y="100">open URL scheme or Shortcut</text>
    <text x="256" y="188">count tap</text>
    <text x="236" y="228">size text</text>
