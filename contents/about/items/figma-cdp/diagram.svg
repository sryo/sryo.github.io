<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176">
  <title>Figma-CDP: you ask for a change, Claude reads the code, saves a version, and the frame updates in your open Figma; if it's wrong, you restore that version</title>
  <defs>
    <marker id="figma-cdp-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#figma-cdp-head)"/>
    <rect x="88" y="16" width="136" height="48"/>
    <path d="M224 40H248" marker-end="url(#figma-cdp-head)"/>
    <rect x="256" y="16" width="176" height="48"/>
    <path d="M432 40H456" marker-end="url(#figma-cdp-head)"/>
    <rect x="464" y="16" width="152" height="48"/>
    <path d="M540 64V104" marker-end="url(#figma-cdp-head)"/>
    <rect x="464" y="112" width="152" height="48"/>
    <path d="M464 136H440" marker-end="url(#figma-cdp-head)"/>
    <rect x="264" y="112" width="168" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="156" y="40">Ask for a change</text>
    <text x="344" y="40">Claude reads the code</text>
    <text x="540" y="40">It saves a version</text>
    <text x="540" y="136">The frame updates</text>
    <text x="348" y="136">If wrong, restore it</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="464" y="84">in your open Figma</text>
  </g>
</svg>
