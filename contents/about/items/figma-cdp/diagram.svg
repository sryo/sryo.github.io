<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248">
  <title>Figma-CDP: Claude Code runs the skill, which sends Plugin API scripts or a captured web page through agent-browser to the open Figma tab over the Chrome DevTools Protocol, then reads the result back</title>
  <defs>
    <marker id="figma-cdp-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="48" cy="80" r="24"/>
    <path d="M72 80H104" marker-end="url(#figma-cdp-head)"/>
    <path d="M232 80H272" marker-end="url(#figma-cdp-head)"/>
    <rect x="272" y="56" width="128" height="48"/>
    <path d="M400 80H456" marker-end="url(#figma-cdp-head)"/>
    <circle cx="480" cy="80" r="24"/>
    <path d="M504 80H576" stroke-dasharray="4 4" marker-end="url(#figma-cdp-head)"/>
    <circle cx="600" cy="80" r="24"/>
    <path d="M600 56V16H48V56" stroke-dasharray="4 4" marker-end="url(#figma-cdp-head)"/>
    <path d="M168 104V168" marker-end="url(#figma-cdp-head)"/>
    <circle cx="48" cy="192" r="24"/>
    <path d="M72 192H104" marker-end="url(#figma-cdp-head)"/>
    <rect x="104" y="168" width="120" height="48"/>
    <path d="M224 192H304" marker-end="url(#figma-cdp-head)"/>
    <rect x="304" y="168" width="144" height="48"/>
    <path d="M448 192H480V104" marker-end="url(#figma-cdp-head)"/>
  </g>
  <rect x="104" y="56" width="128" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="48" y="120">Claude Code</text>
    <text class="knock" x="168" y="80">SKILL.md</text>
    <text x="336" y="80">figma_run.py</text>
    <text x="480" y="40">agent-browser</text>
    <text x="600" y="120">Figma tab</text>
    <text x="48" y="232">Live page</text>
    <text x="164" y="192">figma_walker.js</text>
    <text x="376" y="192">figma_importer.js</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="324" y="28">result, read back to verify</text>
    <text x="540" y="68">CDP eval</text>
    <text x="176" y="136" text-anchor="start">walk &lt;url&gt;</text>
    <text x="264" y="180">spec JSON</text>
    <text x="488" y="152" text-anchor="start">chunks</text>
  </g>
</svg>
