<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192">
  <title>Trueframe: you hold the phone to your chest, feel a heartbeat for every shot, lift it when the moment is over, and only the good photos fan out into your library</title>
  <defs>
    <marker id="trueframe-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#trueframe-head)"/>
    <rect x="88" y="16" width="192" height="48"/>
    <path d="M280 40H312" marker-end="url(#trueframe-head)"/>
    <rect x="320" y="16" width="224" height="48"/>
    <path d="M432 64V104" marker-end="url(#trueframe-head)"/>
    <rect x="344" y="112" width="176" height="48"/>
    <path d="M344 136H320" marker-end="url(#trueframe-head)"/>
    <rect x="88" y="112" width="224" height="48"/>
    <path d="M88 136H64" marker-end="url(#trueframe-head)"/>
    <circle cx="32" cy="136" r="24"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="184" y="40">Hold it to your chest</text>
    <text x="432" y="40">Feel a heartbeat per shot</text>
    <text x="432" y="136">Lift it</text>
    <text x="200" y="136">The good ones fan out</text>
    <text x="32" y="176">Photos</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="512" y="84">when it's over</text>
  </g>
</svg>
