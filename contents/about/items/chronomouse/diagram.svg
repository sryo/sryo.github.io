<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>ChronoMouse: you move the mouse, the hour appears beside the pointer, its spot around the pointer shows the minutes, holding Option shows them as a number, and typing makes it fade</title>
  <defs>
    <marker id="chronomouse-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#chronomouse-head)"/>
    <rect x="88" y="16" width="128" height="48"/>
    <path d="M216 40H248" marker-end="url(#chronomouse-head)"/>
    <rect x="256" y="16" width="216" height="48"/>
    <path d="M448 64V104" marker-end="url(#chronomouse-head)"/>
    <rect x="416" y="112" width="216" height="48"/>
    <path d="M416 136H400" marker-end="url(#chronomouse-head)"/>
    <rect x="200" y="112" width="192" height="48"/>
    <path d="M200 136H176" marker-end="url(#chronomouse-head)"/>
    <rect x="16" y="112" width="152" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="152" y="40">Move the mouse</text>
    <text x="364" y="40">The hour appears beside it</text>
    <text x="524" y="136">Its spot shows the minutes</text>
    <text x="296" y="136">Hold Option for minutes</text>
    <text x="92" y="136">Type, and it fades</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="520" y="84">like a minute hand</text>
  </g>
</svg>
