<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176">
  <title>GmailTidy: read mail leaves your inbox after a day, promos wait in pretrash, threads you haven't answered come back after a few days, and you reply once to the daily digest</title>
  <defs>
    <marker id="gmailtidy-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#gmailtidy-head)"/>
    <rect x="88" y="16" width="232" height="48"/>
    <path d="M320 40H344" marker-end="url(#gmailtidy-head)"/>
    <rect x="352" y="16" width="200" height="48"/>
    <path d="M452 64V104" marker-end="url(#gmailtidy-head)"/>
    <rect x="328" y="112" width="248" height="48"/>
    <path d="M328 136H312" marker-end="url(#gmailtidy-head)"/>
    <rect x="104" y="112" width="200" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="204" y="40">Read mail leaves after a day</text>
    <text x="452" y="40">Promos wait in pretrash</text>
    <text x="452" y="136">Unanswered threads come back</text>
    <text x="204" y="136">Reply once to the digest</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="384" y="84">2 to 4 days later</text>
  </g>
</svg>
