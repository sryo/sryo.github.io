<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>When: you tell it what you want, it spots a match in a feed, you approve it in the inbox, it downloads, and a playlet casts it to your TV</title>
  <defs>
    <marker id="when-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#when-head)"/>
    <rect x="88" y="16" width="176" height="48"/>
    <path d="M264 40H296" marker-end="url(#when-head)"/>
    <path d="M400 40H432" marker-end="url(#when-head)"/>
    <rect x="440" y="16" width="176" height="48"/>
    <path d="M528 64V104" marker-end="url(#when-head)"/>
    <rect x="424" y="112" width="208" height="48"/>
    <path d="M424 136H400" marker-end="url(#when-head)"/>
    <rect x="280" y="112" width="112" height="48"/>
    <path d="M280 136H248" marker-end="url(#when-head)"/>
    <rect x="80" y="112" width="160" height="48"/>
    <path d="M80 136H64" marker-end="url(#when-head)"/>
    <circle cx="32" cy="136" r="24"/>
  </g>
  <rect x="304" y="16" width="96" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="176" y="40">Tell it what you want</text>
    <text class="knock" x="352" y="40">When</text>
    <text x="528" y="40">It spots it in a feed</text>
    <text x="528" y="136">Approve it in the inbox</text>
    <text x="336" y="136">It downloads</text>
    <text x="160" y="136">A playlet casts it</text>
    <text x="32" y="136">TV</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="560" y="84">a match</text>
  </g>
</svg>
