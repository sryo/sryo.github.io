      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H104" stroke-dasharray="4 4" marker-end="url(#head)"/>
    <rect x="104" y="16" width="144" height="48"/>
    <path d="M248 40H296" marker-end="url(#head)"/>
    <rect x="296" y="16" width="112" height="48"/>
    <path d="M408 40H472" marker-end="url(#head)"/>
    <rect x="472" y="16" width="160" height="48"/>
    <path d="M552 64V120" marker-end="url(#head)"/>
    <path d="M472 144H416" marker-end="url(#head)"/>
    <rect x="232" y="120" width="184" height="48"/>
