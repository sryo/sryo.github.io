    <rect x="232" y="176" width="184" height="48"/>
    <path d="M232 200H56" stroke-dasharray="4 4" marker-end="url(#head)"/>
    <circle cx="32" cy="200" r="24"/>
  </g>
  <rect x="472" y="120" width="160" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">Feeds</text>
    <text x="176" y="40">match interests</text>
    <text x="352" y="40">inbox</text>
    <text x="552" y="40">librqbit</text>
    <text class="knock" x="552" y="144">playlets</text>
    <text x="324" y="144">move, notify, subtitles</text>
    <text x="324" y="200">Axum media server</text>
    <text x="32" y="200">TV</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
