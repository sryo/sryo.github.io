<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192">
  <title>Chanchán: you type a beat in plain Spanish words, hear it play, swap a word from its menu, copy the link, and a friend who opens it hears the same song</title>
  <defs>
    <marker id="chanchan-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#chanchan-head)"/>
    <rect x="88" y="16" width="208" height="48"/>
    <path d="M296 40H328" marker-end="url(#chanchan-head)"/>
    <rect x="336" y="16" width="144" height="48"/>
    <path d="M408 64V104" marker-end="url(#chanchan-head)"/>
    <rect x="328" y="112" width="160" height="48"/>
    <path d="M328 136H296" marker-end="url(#chanchan-head)"/>
    <rect x="160" y="112" width="128" height="48"/>
    <path d="M160 136H64" marker-end="url(#chanchan-head)"/>
    <circle cx="32" cy="136" r="24"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="192" y="40">Type la bata toca pum pa</text>
    <text x="408" y="40">Hear it play</text>
    <text x="408" y="136">Swap a word from ▾</text>
    <text x="224" y="136">Copy the link</text>
    <text x="32" y="176">Friend</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="112" y="124">same song</text>
  </g>
</svg>
