<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>Dirpad: you hold Option and slide the trackpad, the list moves one step at a time, and adding Ctrl and Shift selects word by word</title>
  <defs>
    <marker id="dirpad-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#dirpad-head)"/>
    <rect x="88" y="16" width="112" height="48"/>
    <path d="M200 40H224" marker-end="url(#dirpad-head)"/>
    <rect x="232" y="16" width="176" height="48"/>
    <path d="M408 40H440" marker-end="url(#dirpad-head)"/>
    <rect x="448" y="16" width="176" height="48"/>
    <path d="M536 64V104" marker-end="url(#dirpad-head)"/>
    <rect x="456" y="112" width="160" height="48"/>
    <path d="M456 136H424" marker-end="url(#dirpad-head)"/>
    <rect x="224" y="112" width="192" height="48"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="144" y="40">Hold Option</text>
    <text x="320" y="40">Slide the trackpad</text>
    <text x="536" y="40">It moves step by step</text>
    <text x="536" y="136">Add Ctrl and Shift</text>
    <text x="320" y="136">It selects word by word</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="592" y="84">to select</text>
  </g>
</svg>
