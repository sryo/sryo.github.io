<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256">
  <title>AirNod: you put on your AirPods; a nod or turn scrolls the page, an ear tilt clicks, two shakes start a countdown to a new center, and looking away pauses it</title>
  <defs>
    <marker id="airnod-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="128" r="24"/>
    <path d="M56 128H80" marker-end="url(#airnod-head)"/>
    <rect x="88" y="104" width="128" height="48"/>
    <path d="M216 128H240" marker-end="url(#airnod-head)"/>
    <path d="M344 128H360"/>
    <path d="M360 128V32H448" marker-end="url(#airnod-head)"/>
    <path d="M360 128V96H448" marker-end="url(#airnod-head)"/>
    <path d="M360 128V160H448" marker-end="url(#airnod-head)"/>
    <path d="M360 128V224H448" marker-end="url(#airnod-head)"/>
    <rect x="456" y="8" width="176" height="48"/>
    <rect x="456" y="72" width="176" height="48"/>
    <rect x="456" y="136" width="176" height="48"/>
    <rect x="456" y="200" width="176" height="48"/>
  </g>
  <rect x="248" y="104" width="96" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="128">You</text>
    <text x="152" y="128">Put on AirPods</text>
    <text class="knock" x="296" y="128">AirNod</text>
    <text x="544" y="32">The page scrolls</text>
    <text x="544" y="96">Left or right click</text>
    <text x="544" y="160">3, 2, 1, new center</text>
    <text x="544" y="224">It pauses</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="404" y="20">nod or turn</text>
    <text x="404" y="84">tilt an ear</text>
    <text x="404" y="148">shake twice</text>
    <text x="404" y="212">look away</text>
  </g>
</svg>
