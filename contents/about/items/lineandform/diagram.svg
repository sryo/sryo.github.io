    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <rect x="8" y="16" width="160" height="48"/>
    <rect x="8" y="80" width="160" height="48"/>
    <rect x="8" y="144" width="160" height="48"/>
    <path d="M168 40H184V88H208" marker-end="url(#head)"/>
    <path d="M168 104H208" marker-end="url(#head)"/>
    <path d="M168 168H184V120H208" marker-end="url(#head)"/>
    <path d="M352 104H368V56H464" marker-end="url(#head)"/>
