<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>LineAndForm: you add a folder, run one script, and the project shows up as a new row in the ledger and as a page of its own</title>
  <defs>
    <marker id="lineandform-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#lineandform-head)"/>
    <rect x="88" y="16" width="112" height="48"/>
    <path d="M200 40H232" marker-end="url(#lineandform-head)"/>
    <path d="M352 40H392" marker-end="url(#lineandform-head)"/>
    <rect x="400" y="16" width="192" height="48"/>
    <path d="M376 40V136H392" marker-end="url(#lineandform-head)"/>
    <rect x="400" y="112" width="192" height="48"/>
  </g>
  <rect x="240" y="16" width="112" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="144" y="40">Add a folder</text>
    <text class="knock" x="296" y="40">LineAndForm</text>
    <text x="496" y="40">A new row in the ledger</text>
    <text x="496" y="136">A page of its own</text>
  </g>
</svg>
