<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192">
  <title>Murmur: you open a room and share its code, hold your mouth to talk, see a friend's ear turn into a mouth when they answer, and hold their ear to whisper to them alone</title>
  <defs>
    <marker id="murmur-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#murmur-head)"/>
    <rect x="88" y="16" width="224" height="48"/>
    <path d="M312 40H344" marker-end="url(#murmur-head)"/>
    <rect x="352" y="16" width="192" height="48"/>
    <path d="M448 64V104" marker-end="url(#murmur-head)"/>
    <rect x="328" y="112" width="240" height="48"/>
    <path d="M328 136H296" marker-end="url(#murmur-head)"/>
    <rect x="104" y="112" width="184" height="48"/>
    <path d="M104 136H64" marker-end="url(#murmur-head)"/>
    <circle cx="32" cy="136" r="24"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="200" y="40">Open a room, share its code</text>
    <text x="448" y="40">Hold your mouth to talk</text>
    <text x="448" y="136">Their ear turns into a mouth</text>
    <text x="196" y="136">Hold an ear to whisper</text>
    <text x="32" y="176">Friend</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="512" y="84">they answer</text>
  </g>
</svg>
