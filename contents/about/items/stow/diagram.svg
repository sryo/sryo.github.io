<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>Stow: you switch to Safari and the sidebar docks beside it with your workspaces, you click a saved link, and the tab that is already open comes forward</title>
  <defs>
    <marker id="stow-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#stow-head)"/>
    <rect x="88" y="16" width="144" height="48"/>
    <path d="M232 40H344" marker-end="url(#stow-head)"/>
    <path d="M400 64V104" marker-end="url(#stow-head)"/>
    <rect x="320" y="112" width="160" height="48"/>
    <path d="M320 136H240" marker-end="url(#stow-head)"/>
    <rect x="16" y="112" width="216" height="48"/>
  </g>
  <rect x="352" y="16" width="96" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="160" y="40">Switch to Safari</text>
    <text class="knock" x="400" y="40">Stow</text>
    <text x="400" y="136">Click a saved link</text>
    <text x="124" y="136">The open tab comes forward</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="288" y="28">it docks there</text>
    <text x="464" y="84">same workspaces</text>
  </g>
</svg>
