<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>AppTidy: you close an app's last window, five minutes later it quits, a toast offers to undo, and undoing within five seconds relaunches the app</title>
  <defs>
    <marker id="apptidy-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#apptidy-head)"/>
    <rect x="88" y="16" width="184" height="48"/>
    <path d="M272 40H400" marker-end="url(#apptidy-head)"/>
    <path d="M456 64V104" marker-end="url(#apptidy-head)"/>
    <rect x="376" y="112" width="160" height="48"/>
    <path d="M376 136H248" marker-end="url(#apptidy-head)"/>
    <rect x="88" y="112" width="152" height="48"/>
  </g>
  <rect x="408" y="16" width="96" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="180" y="40">Close its last window</text>
    <text class="knock" x="456" y="40">AppTidy</text>
    <text x="456" y="136">A toast: Undo close</text>
    <text x="164" y="136">The app relaunches</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="336" y="28">5 minutes later</text>
    <text x="496" y="84">it quits</text>
    <text x="312" y="124">undo in 5 seconds</text>
  </g>
</svg>
