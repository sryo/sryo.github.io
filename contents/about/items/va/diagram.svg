<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 168">
  <title>Va: you type the amount, pick who gets it and confirm with Face ID, and Va moves the money</title>
  <defs>
    <marker id="va-head" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="40" r="24"/>
    <path d="M56 40H80" marker-end="url(#va-head)"/>
    <rect x="88" y="16" width="136" height="48"/>
    <path d="M224 40H256" marker-end="url(#va-head)"/>
    <rect x="264" y="16" width="96" height="48"/>
    <path d="M360 40H392" marker-end="url(#va-head)"/>
    <rect x="400" y="16" width="176" height="48"/>
    <path d="M488 64V104" marker-end="url(#va-head)"/>
    <path d="M440 136H408" marker-end="url(#va-head)"/>
    <rect x="240" y="112" width="160" height="48"/>
  </g>
  <rect x="440" y="112" width="96" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="40">You</text>
    <text x="156" y="40">Type the amount</text>
    <text x="312" y="40">Pick who</text>
    <text x="488" y="40">Confirm with Face ID</text>
    <text class="knock" x="488" y="136">Va</text>
    <text x="320" y="136">The money moves</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" text-anchor="middle" dominant-baseline="central">
    <text x="536" y="84">three taps</text>
  </g>
</svg>
