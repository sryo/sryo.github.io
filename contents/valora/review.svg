<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192">
  <title>Valora: from a filing, the platform's AI suggests the equity figures, an analyst confirms or overrides each one, and only then does it commit</title>
  <defs>
    <marker id="valora-head-a" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="currentColor"/>
    </marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="32" cy="96" r="24"/>
    <path d="M56 96H136" marker-end="url(#valora-head-a)"/>
    <path d="M256 96H360" marker-end="url(#valora-head-a)"/>
    <rect x="368" y="72" width="120" height="48"/>
    <path d="M428 72V32H576V64" marker-end="url(#valora-head-a)"/>
    <path d="M428 120V160H576V128" marker-end="url(#valora-head-a)"/>
    <rect x="520" y="72" width="112" height="48"/>
  </g>
  <rect x="144" y="72" width="112" height="48" fill="currentColor"/>
  <g fill="currentColor" font-size="14" text-anchor="middle" dominant-baseline="central">
    <text x="32" y="136">Filing</text>
    <text class="knock" x="200" y="96">AI extraction</text>
    <text x="428" y="96">Analyst review</text>
    <text x="576" y="96">Committed</text>
  </g>
  <g class="mute" fill="currentColor" font-size="12" dominant-baseline="central">
    <text x="308" y="80" text-anchor="middle">suggestions</text>
    <text x="502" y="20" text-anchor="middle">confirm</text>
    <text x="502" y="172" text-anchor="middle">override</text>
  </g>
</svg>
